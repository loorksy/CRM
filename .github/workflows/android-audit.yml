name: Android audit APK

on:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-audit.yml"
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-audit.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Verify fixtures against the original payroll engine
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-parity" bcryptjs@2.4.3 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/audit-parity/node_modules" node mobile/android/parity/generate-fixtures.js
          git diff --exit-code -- mobile/android/engine/src/test/resources/
      - name: Test and build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew :engine:test :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-lork-audit-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
