name: Android audit APK

on:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-audit.yml"
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-audit.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Test and build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew :engine:test :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-lork-audit-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
